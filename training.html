<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deutschstudio · Lernpfade</title><style>
:root{font-family:ui-rounded,"Avenir Next",system-ui,sans-serif;color:#302c25;background:#f7f5ee}*{box-sizing:border-box}body{margin:0}header{background:#f1e3b8;padding:22px max(18px,calc((100% - 960px)/2))}main{max-width:960px;margin:auto;padding:22px 18px}a{color:#705123}h1{margin:6px 0}h2{margin:10px 0}p{line-height:1.6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{border:1px solid #e3dac6;background:white;border-radius:17px;padding:18px}.pick{width:100%;text-align:left;cursor:pointer;font:inherit}.pick:hover,.answer:hover{background:#fff7df}.muted{color:#71695e}.tag{display:inline-block;border-radius:30px;background:#f7ecd0;padding:5px 10px;font-size:13px}.btn{border:0;background:#735526;color:white;padding:12px 18px;border-radius:10px;font:inherit;cursor:pointer}.answer{display:block;background:#fff;border:1px solid #ded4bd;padding:12px;border-radius:11px;width:100%;text-align:left;font:inherit;margin:8px 0;cursor:pointer}.answer:disabled{opacity:.8;cursor:default}input{width:100%;padding:12px;border:1px solid #d7c9ab;border-radius:10px;font:inherit}#exercise{display:none}.success{color:#166a4d}.error{color:#994a27}.progress{height:9px;background:#eee5d2;border-radius:10px;overflow:hidden}.progress>div{height:100%;background:#c9a34a;transition:width .2s}.tokens{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tokens button{padding:10px;border:1px solid #c9b78d;border-radius:9px;background:#fff;cursor:pointer;font:inherit}.tokens button:disabled{opacity:.4}.response{min-height:40px;background:#faf5e8;border-radius:10px;padding:10px}.hidden{display:none!important}button:focus-visible,input:focus-visible{outline:3px solid #a77922;outline-offset:2px}</style></head><body>
<header><a href="./">← Deutschstudio</a><h1>Lernpfade</h1><p>Verstehen · Anwenden · Überprüfen</p></header><main><div class="card" style="margin-bottom:16px"><strong>⭐ <span id="stars">0</span> Deutsch-Sterne</strong> · Level <strong id="level">1</strong><p class="muted">Für jede erstmals korrekt gelöste Aufgabe gibt es einen Stern. Fehler dürfen verbessert werden.</p></div>
<section id="catalog"><h2>Wähle dein Training</h2><div id="paths" class="grid"></div></section>
<section id="exercise" class="card"><button class="btn" id="back">← Lernpfade</button><p class="muted" id="meta"></p><div class="progress"><div id="bar"></div></div><h2 id="title"></h2><p id="prompt"></p><div id="textpanel" class="card hidden" style="background:#fcf9f0;margin:12px 0"><div id="readingtext" style="white-space:pre-wrap;line-height:1.8"></div><div style="margin-top:12px"><button class="btn" id="playaudio" type="button">▶ Text anhören</button> <button class="btn" id="stopaudio" type="button" style="background:#847a68">■ Stopp</button></div><small id="audiostatus" style="display:block;margin-top:8px">Die Sprachausgabe nutzt die auf diesem Gerät verfügbaren Stimmen.</small></div><div id="interaction"></div><p id="feedback" aria-live="polite"></p><button class="btn hidden" id="next">Weiter →</button></section>
</main><script>
const paths=[
{id:'lesen5',name:'Lesen · Schlussfolgern',sub:'Klasse 5–7 · Textverständnis',tasks:[
{type:'choice',q:'Lies: „Als Nele die nassen Fußspuren im Flur sah, stellte sie ihren Schirm in den Ständer.“ Was lässt sich sicher aus dem Text schließen?',options:['Nele hat einen Schirm.','Nele ist mit dem Fahrrad gefahren.','Nele wohnt allein.'],answer:0,why:'Nur der Schirm wird ausdrücklich erwähnt. Die anderen Aussagen sind nicht belegt.'},
{type:'choice',q:'„Obwohl die Mannschaft gut vorbereitet war, verlor sie das Spiel.“ Welche Aussage trifft zu?',options:['Die Niederlage steht im Gegensatz zur Erwartung.','Die Mannschaft hatte nicht trainiert.','Das Spiel wurde abgesagt.'],answer:0,why:'„Obwohl“ kennzeichnet einen Gegensatz zur Erwartung.'},
{type:'input',q:'Ergänze das passende Bindewort: „Mila blieb zu Hause, ___ sie Fieber hatte.“',answers:['weil'],why:'„weil“ leitet einen begründenden Nebensatz ein.'}]},
{id:'grammatik5',name:'Grammatik · Satzbau',sub:'Klasse 5–7 · Satzglieder und Wortarten',tasks:[
{type:'choice',q:'„Am Morgen liest Amir seiner Schwester ein Buch vor.“ Welche Wortgruppe ist die Zeitangabe?',options:['Am Morgen','seiner Schwester','ein Buch'],answer:0,why:'„Am Morgen“ beantwortet die Frage „Wann?“'},
{type:'order',q:'Bilde einen korrekten Aussagesatz. Beginne mit „Heute“.',words:['Heute','liest','Mina','ein Buch.'],answer:['Heute','liest','Mina','ein Buch.'],why:'Im Aussagesatz steht das finite Verb an zweiter Stelle.'},
{type:'input',q:'Setze das Verb im Präteritum ein: „Gestern ___ wir im Park.“ (spielen)',answers:['spielten'],why:'Die 1. Person Plural im Präteritum lautet „wir spielten“.'}]},
{id:'rechtschreibung',name:'Rechtschreibung · Strategien',sub:'Klasse 5–7 · Ableiten und Verlängern',tasks:[
{type:'choice',q:'Warum schreibt man „Häuser“ mit ä?',options:['Weil es von „Haus“ abgeleitet wird.','Weil alle Mehrzahlformen ä enthalten.','Weil das Wort mit H beginnt.'],answer:0,why:'Die Ableitungsstrategie verbindet „Haus“ mit „Häuser“.'},
{type:'input',q:'Verlängere das Wort „Hund“: „viele ___“. Schreibe nur das Wort.',answers:['Hunde'],why:'Durch Verlängern wird der Laut d am Wortende hörbar.'},
{type:'choice',q:'Welcher Satz verwendet die Nominalisierung richtig?',options:['Das Lesen macht Spaß.','Das lesen macht Spaß.','Das Lesen macht spaß.'],answer:0,why:'Nach „das“ wird das substantivierte Verb „Lesen“ großgeschrieben. „Spaß“ ist ebenfalls ein Nomen.'}]},
{id:'daz0',name:'DaZ · A0',sub:'Erste Wörter und Satzmuster',tasks:[
{type:'choice',q:'📚 Was siehst du? Wähle Wort und Artikel.',options:['die Bücher','der Stuhl','das Fenster'],answer:0,why:'„Bücher“ ist der Plural von „das Buch“. Im Plural steht der bestimmte Artikel „die“.'},
{type:'order',q:'Baue einen Satz.',words:['Ich','heiße','Mina.'],answer:['Ich','heiße','Mina.'],why:'„Ich heiße …“ ist ein Satzmuster zum Vorstellen.'},
{type:'input',q:'Ergänze: „Guten ___!“ (Begrüßung am Morgen)',answers:['Morgen'],why:'„Guten Morgen!“ ist eine übliche Begrüßung.'}]},
{id:'daz1',name:'DaZ · A1',sub:'Alltag und einfache Sätze',tasks:[
{type:'choice',q:'Du möchtest im Unterricht etwas fragen. Welcher Satz ist höflich und passend?',options:['Darf ich etwas fragen?','Ich Frage jetzt.','Du müssen antworten.'],answer:0,why:'„Darf ich …?“ ist eine höfliche Frageform.'},
{type:'order',q:'Bilde eine Frage.',words:['Wo','wohnst','du?'],answer:['Wo','wohnst','du?'],why:'Bei W-Fragen steht das Fragewort zuerst, danach das Verb.'},
{type:'input',q:'Ergänze: „Ich ___ zwölf Jahre alt.“',answers:['bin'],why:'Das Verb „sein“ lautet bei „ich“: „bin“.'}]},
{id:'daz2',name:'DaZ · A2',sub:'Erlebnisse und Begründungen',tasks:[
{type:'order',q:'Bilde einen Satz im Perfekt.',words:['Gestern','habe','ich','gelernt.'],answer:['Gestern','habe','ich','gelernt.'],why:'Das Hilfsverb steht an Position 2, das Partizip am Ende.'},
{type:'choice',q:'„Ich nehme einen Regenschirm mit, weil …“ Welche Fortsetzung ist grammatisch richtig?',options:['es heute regnet.','es regnet heute.','heute es regnet.'],answer:0,why:'Im weil-Nebensatz steht das finite Verb am Ende.'},
{type:'input',q:'Ergänze: „Wir sind gestern nach Hause ___.“ (gehen)',answers:['gegangen'],why:'Das Partizip II von „gehen“ lautet „gegangen“.'}]},
{id:'daz3',name:'DaZ · B1',sub:'Argumentieren und Zusammenhänge',tasks:[
{type:'choice',q:'Welche Formulierung leitet ein Gegenargument sachlich ein?',options:['Demgegenüber lässt sich einwenden, dass …','Das ist totaler Quatsch!','Mir egal.'],answer:0,why:'Die Formulierung zeigt einen Gegensatz in sachlichem Register.'},
{type:'input',q:'Ergänze das Bindewort: „___ es regnete, gingen wir spazieren.“',answers:['obwohl'],why:'„Obwohl“ drückt einen Gegensatz zur Erwartung aus.'},
{type:'order',q:'Ordne die Wörter zu einem korrekten Satz.',words:['Wenn','ich','Zeit','habe,','lese','ich.'],answer:['Wenn','ich','Zeit','habe,','lese','ich.'],why:'Der vorangestellte Nebensatz endet mit dem Verb; im Hauptsatz folgt dann das finite Verb.'}]},
{id:'daz4',name:'DaZ · B2',sub:'Bildungssprache und differenziertes Argumentieren',tasks:[
{type:'choice',q:'Welche Formulierung kennzeichnet eine vorsichtige Schlussfolgerung?',options:['Die Ergebnisse deuten darauf hin, dass …','Damit ist alles endgültig bewiesen.','Das muss einfach so sein.'],answer:0,why:'„deuten darauf hin“ markiert eine begründete, aber nicht absolute Schlussfolgerung.'},
{type:'input',q:'Ergänze die Konjunktion: „Die Maßnahme ist sinnvoll, ___ sie hohe Kosten verursacht.“',answers:['obwohl'],why:'„obwohl“ stellt den Gegensatz zwischen Nutzen und Kosten her.'},
{type:'choice',q:'Welche Aussage trennt Beobachtung und Bewertung am klarsten?',options:['Die Zahl stieg um 20 Prozent; ob dies positiv ist, hängt vom Ziel ab.','20 Prozent mehr ist immer gut.','Zahlen beweisen automatisch Erfolg.'],answer:0,why:'Eine Datenbeschreibung und ihre Bewertung sind unterschiedliche Schritte.'}]}
];

const extended=[
{id:'lesen-schulhof',name:'Lesewerkstatt · Der neue Schulhof',sub:'Klasse 5–7 · Erzähltext und Lesestrategien',text:'Als die Klasse 6b nach den Ferien auf den Schulhof kam, staunten alle. Wo früher nur Asphalt gewesen war, standen nun drei junge Bäume und mehrere Holzbänke. Neben dem Fahrradständer lag ein kleiner Garten. „Endlich ein Ort, an dem man in Ruhe lesen kann“, sagte Samira. Leon war skeptisch. „Und wo spielen wir jetzt Fußball?“ Die Klassenlehrerin erklärte, dass die freie Fläche hinter der Turnhalle weiterhin zum Spielen genutzt werden könne. In der ersten Pause setzten sich einige Kinder auf die Bänke. Andere halfen beim Gießen. Leon beobachtete sie zunächst aus der Entfernung. Am Freitag brachte er selbst eine kleine Gießkanne mit. „Vielleicht ist der Garten doch keine schlechte Idee“, meinte er.',tasks:[
{type:'choice',q:'Was hat sich auf dem Schulhof verändert?',options:['Es gibt Bäume, Bänke und einen Garten.','Die Turnhalle wurde abgerissen.','Der Schulhof ist vollständig gesperrt.'],answer:0,why:'Der erste Abschnitt beschreibt die neuen Elemente.'},
{type:'choice',q:'Warum freut sich Samira?',options:['Sie kann dort in Ruhe lesen.','Sie möchte Fußball spielen.','Sie hat den Garten allein geplant.'],answer:0,why:'Samira nennt das Lesen als Grund.'},
{type:'choice',q:'Welche Sorge hat Leon zuerst?',options:['Es könnte weniger Platz zum Fußballspielen geben.','Die Bäume könnten zu hoch werden.','Es gibt zu wenige Fahrräder.'],answer:0,why:'Seine Frage nach dem Fußballplatz zeigt seine Sorge.'},
{type:'choice',q:'Welche Information widerlegt Leons Sorge?',options:['Hinter der Turnhalle bleibt eine Spielfläche.','Alle müssen im Garten arbeiten.','Der Schulhof wird wieder asphaltiert.'],answer:0,why:'Die Lehrerin nennt ausdrücklich die freie Fläche hinter der Turnhalle.'},
{type:'choice',q:'Woran erkennt man, dass Leon seine Meinung verändert?',options:['Er bringt eine Gießkanne mit.','Er verlässt die Schule.','Er spricht nicht mehr mit Samira.'],answer:0,why:'Sein Verhalten und seine Aussage am Freitag zeigen den Wandel.'},
{type:'choice',q:'Welche Aussage ist eine begründete Vermutung, keine sichere Textinformation?',options:['Leon wird künftig regelmäßig im Garten helfen.','Es stehen drei junge Bäume dort.','Samira freut sich über einen Leseplatz.'],answer:0,why:'Regelmäßige Hilfe wird nicht erzählt, ist aber denkbar.'},
{type:'input',q:'Wie heißt das Wort im Text, das „nicht überzeugt“ bedeutet? Schreibe es ab.',answers:['skeptisch'],why:'„skeptisch“ beschreibt Leons anfängliche Haltung.'},
{type:'choice',q:'Aus welcher Perspektive wird die Geschichte erzählt?',options:['Ein Erzähler berichtet über die Kinder.','Leon erzählt in der Ich-Form.','Samira schreibt einen Brief.'],answer:0,why:'Der Text verwendet die dritte Person und einen Erzähler.'},
{type:'choice',q:'Welche Überschrift passt am besten?',options:['Ein Schulhof verändert sich','Das verschwundene Fahrrad','Ein Fußballturnier'],answer:0,why:'Die Veränderung des Schulhofs ist das zentrale Thema.'},
{type:'choice',q:'Welche Botschaft lässt sich aus dem Text ableiten?',options:['Neue Ideen können nach anfänglichen Zweifeln überzeugen.','Veränderungen sind immer schlecht.','Fußball ist grundsätzlich verboten.'],answer:0,why:'Leon ändert seine Haltung durch eigene Erfahrungen.'}]},
{id:'hoeren-bibliothek',name:'Hörstudio · In der Bibliothek',sub:'Klasse 5–7 · Hörverstehen und Informationen entnehmen',audioOnly:true,text:'Guten Morgen! Ich bin Frau Weber aus der Schulbibliothek. Ab Montag könnt ihr in der großen Pause Bücher ausleihen. Bringt dafür euren Schülerausweis mit. Ihr dürft höchstens drei Bücher gleichzeitig mitnehmen. Die Leihfrist beträgt zwei Wochen. Wenn ihr ein Buch länger braucht, könnt ihr die Ausleihe einmal verlängern. Am Mittwoch bleibt die Bibliothek wegen einer Fortbildung geschlossen. Für Fragen bin ich dienstags und donnerstags nach dem Unterricht da.',tasks:[
{type:'choice',q:'Ab wann können Bücher ausgeliehen werden?',options:['Ab Montag','Ab Mittwoch','Ab Freitag'],answer:0,why:'Frau Weber sagt „Ab Montag“.'},
{type:'choice',q:'Was muss man zur Ausleihe mitbringen?',options:['Den Schülerausweis','Ein eigenes Buch','Einen Elternbrief'],answer:0,why:'Der Schülerausweis wird ausdrücklich genannt.'},
{type:'input',q:'Wie viele Bücher darf man höchstens gleichzeitig ausleihen? Schreibe die Zahl.',answers:['3','drei'],why:'Die Grenze beträgt drei Bücher.'},
{type:'choice',q:'Wie lange dauert die reguläre Leihfrist?',options:['Zwei Wochen','Eine Woche','Vier Wochen'],answer:0,why:'Die Durchsage nennt zwei Wochen.'},
{type:'choice',q:'Wie oft kann man die Ausleihe verlängern?',options:['Einmal','Zweimal','Beliebig oft'],answer:0,why:'Eine einmalige Verlängerung ist möglich.'},
{type:'choice',q:'Warum ist die Bibliothek am Mittwoch geschlossen?',options:['Wegen einer Fortbildung','Wegen der Ferien','Wegen eines Umzugs'],answer:0,why:'Als Grund wird eine Fortbildung genannt.'},
{type:'choice',q:'Wann kann man Frau Weber nach dem Unterricht fragen?',options:['Dienstags und donnerstags','Montags und mittwochs','Nur freitags'],answer:0,why:'Diese beiden Tage werden am Ende genannt.'},
{type:'choice',q:'Welche Aussage stimmt?',options:['Man benötigt für die Ausleihe einen Ausweis.','Man darf fünf Bücher ausleihen.','Die Bibliothek ist mittwochs geöffnet.'],answer:0,why:'Nur die erste Aussage entspricht der Durchsage.'},
{type:'choice',q:'Welche Textsorte hast du gehört?',options:['Eine informative Durchsage','Ein Märchen','Eine Werbeanzeige'],answer:0,why:'Die Sprecherin informiert über Regeln und Öffnungszeiten.'},
{type:'choice',q:'Was ist das wichtigste Ziel der Durchsage?',options:['Über die Ausleihe informieren','Eine Geschichte erzählen','Ein Buch bewerten'],answer:0,why:'Die Durchsage erklärt die Nutzung der Bibliothek.'}]},
{id:'daz-alltag-a1',name:'DaZ · A1 · Ein Schultag',sub:'DaZ A1 · Dialog hören, verstehen und Sätze bilden',text:'Mila: Hallo, Karim! Hast du heute Sport? Karim: Ja, in der dritten Stunde. Ich habe meine Sportschuhe dabei. Mila: Ich habe heute Kunst. Danach essen wir in der Mensa. Karim: Was gibt es zum Mittagessen? Mila: Reis mit Gemüse. Karim: Gut! Treffen wir uns um zwölf Uhr vor der Mensa? Mila: Ja, bis später!',tasks:[
{type:'choice',q:'In welcher Stunde hat Karim Sport?',options:['In der dritten Stunde','In der ersten Stunde','In der fünften Stunde'],answer:0,why:'Karim sagt „in der dritten Stunde“.'},
{type:'choice',q:'Was hat Karim dabei?',options:['Sportschuhe','Ein Fahrrad','Einen Regenschirm'],answer:0,why:'Er nennt seine Sportschuhe.'},
{type:'choice',q:'Welches Fach hat Mila?',options:['Kunst','Musik','Mathematik'],answer:0,why:'Mila sagt „Ich habe heute Kunst“.'},
{type:'choice',q:'Wo essen die beiden?',options:['In der Mensa','In der Bibliothek','Im Klassenzimmer'],answer:0,why:'Die Mensa ist der Ort zum Mittagessen.'},
{type:'input',q:'Um wie viel Uhr treffen sie sich? Schreibe nur die Zahl.',answers:['12','zwölf'],why:'Sie verabreden sich um zwölf Uhr.'},
{type:'choice',q:'Was gibt es zum Mittagessen?',options:['Reis mit Gemüse','Nudeln mit Tomaten','Brot mit Käse'],answer:0,why:'Mila nennt Reis mit Gemüse.'},
{type:'order',q:'Bilde einen Satz.',words:['Ich','habe','heute','Sport.'],answer:['Ich','habe','heute','Sport.'],why:'Im Aussagesatz steht „habe“ an zweiter Stelle.'},
{type:'input',q:'Ergänze: „Wir treffen ___ um zwölf Uhr.“',answers:['uns'],why:'„sich treffen“ ist hier reflexiv: „wir treffen uns“.'},
{type:'choice',q:'Welche Frage passt zur Antwort „In der dritten Stunde“?',options:['Wann hast du Sport?','Wo wohnst du?','Wie heißt du?'],answer:0,why:'„Wann“ fragt nach der Zeit.'},
{type:'choice',q:'Was bedeutet „Bis später“?',options:['Wir sehen uns später wieder.','Ich komme nie wieder.','Ich gehe jetzt schlafen.'],answer:0,why:'Es ist eine Verabschiedung bis zum nächsten Treffen.'}]}
];
paths.push(...extended);

const $=id=>document.getElementById(id);let path=null,pos=0,done=false,selected=[];const earnedKey='deutschstudio-quality-earned-v1';let earned={};try{earned=JSON.parse(localStorage.getItem(earnedKey)||'{}')||{}}catch{};const legacy=Number(localStorage.getItem('deutschstudio-demo-stars-v1')||0);function score(){const total=Math.max(0,legacy)+Object.keys(earned).length;$('stars').textContent=total;$('level').textContent=1+Math.floor(total/20)}
function feedback(ok,t){if(done)return;if(!ok){$('feedback').className='error';$('feedback').textContent='Noch nicht ganz. Überprüfe deine Antwort und versuche es erneut.';return}done=true;const id=path.id+':'+pos;let msg='Richtig!';if(!earned[id]){earned[id]=true;localStorage.setItem(earnedKey,JSON.stringify(earned));msg+=' ⭐ +1 Stern'}else msg+=' Diesen Stern hast du schon gesammelt.';$('feedback').className='success';$('feedback').textContent=msg+' '+t.why;$('next').classList.remove('hidden');score()}
function render(){done=false;selected=[];const t=path.tasks[pos];const panel=$('textpanel');panel.classList.toggle('hidden',!path.text);$('readingtext').textContent=path.audioOnly?'Hörtext: Höre die Durchsage an und beantworte anschließend die Fragen.':(path.text||'');$('meta').textContent=path.sub+' · Aufgabe '+(pos+1)+' von '+path.tasks.length;$('bar').style.width=(pos/path.tasks.length*100)+'%';$('title').textContent=path.name;$('prompt').textContent=t.q;$('feedback').textContent='';$('next').classList.add('hidden');const target=$('interaction');target.replaceChildren();if(t.type==='choice'){t.options.forEach((o,i)=>{const b=document.createElement('button');b.className='answer';b.textContent=o;b.onclick=()=>feedback(i===t.answer,t);target.append(b)})}else if(t.type==='input'){const input=document.createElement('input');input.placeholder='Deine Antwort';input.setAttribute('aria-label','Deine Antwort');const b=document.createElement('button');b.className='btn';b.textContent='Prüfen';b.style.marginTop='10px';const check=()=>feedback(t.answers.some(x=>x.toLocaleLowerCase('de').trim()===input.value.toLocaleLowerCase('de').trim()),t);b.onclick=check;input.onkeydown=e=>{if(e.key==='Enter')check()};target.append(input,b)}else{const display=document.createElement('div');display.className='response';display.textContent='Tippe die Wörter in der richtigen Reihenfolge an.';const wrap=document.createElement('div');wrap.className='tokens';const words=[...t.words].map((w,i)=>({w,i})).sort((a,b)=>((a.i*7+3)%11)-((b.i*7+3)%11));function refresh(){display.textContent=selected.map(x=>x.w).join(' ')||'Tippe die Wörter in der richtigen Reihenfolge an.'}words.forEach(obj=>{const b=document.createElement('button');b.textContent=obj.w;b.onclick=()=>{if(done)return;selected.push(obj);b.disabled=true;refresh()};wrap.append(b)});const check=document.createElement('button');check.className='btn';check.textContent='Satz prüfen';check.onclick=()=>feedback(selected.map(x=>x.w).join(' ')===t.answer.join(' '),t);const reset=document.createElement('button');reset.className='btn';reset.style.marginLeft='8px';reset.style.background='#8d826d';reset.textContent='Zurücksetzen';reset.onclick=()=>{selected=[];wrap.querySelectorAll('button').forEach(b=>b.disabled=false);refresh()};target.append(display,wrap,check,reset)}}
function stopSpeech(){if('speechSynthesis' in window)window.speechSynthesis.cancel()};$('playaudio').onclick=()=>{if(!('speechSynthesis' in window)){$('audiostatus').textContent='Auf diesem Gerät ist keine Sprachausgabe verfügbar.';return}stopSpeech();const u=new SpeechSynthesisUtterance(path.text||'');u.lang='de-DE';u.rate=path.id==='daz-alltag-a1'?.82:.92;const voices=window.speechSynthesis.getVoices();const voice=voices.find(v=>v.lang.toLowerCase().startsWith('de'));if(voice)u.voice=voice;u.onerror=()=>{$('audiostatus').textContent='Audio konnte nicht abgespielt werden. Prüfe die Gerätestimmen.'};u.onstart=()=>{$('audiostatus').textContent='Wiedergabe läuft …'};u.onend=()=>{$('audiostatus').textContent='Wiedergabe beendet.'};window.speechSynthesis.speak(u)};$('stopaudio').onclick=stopSpeech;
paths.forEach(p=>{const b=document.createElement('button');b.className='card pick';const h=document.createElement('h3');h.textContent=p.name;const s=document.createElement('p');s.className='muted';s.textContent=p.sub+' · '+p.tasks.length+' Aufgaben';b.append(h,s);b.onclick=()=>{stopSpeech();path=p;pos=0;$('catalog').classList.add('hidden');$('exercise').style.display='block';render()};$('paths').append(b)});$('back').onclick=()=>{stopSpeech();$('catalog').classList.remove('hidden');$('exercise').style.display='none'};$('next').onclick=()=>{stopSpeech();pos++;if(pos>=path.tasks.length){$('bar').style.width='100%';$('interaction').replaceChildren();$('prompt').textContent='Lernpfad abgeschlossen!';$('feedback').textContent='Du kannst einen anderen Lernpfad wählen oder diese Aufgaben wiederholen.';$('next').classList.add('hidden')}else render()};score();
</script></body></html>
